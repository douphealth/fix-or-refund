  <path d="m172 113 18-51 30-13m-84 153 58-40 69-11m-92 98-65-58-29-3m42 114 24-47 36-8m-2 122 32-40 42-3" fill="none" stroke="#e6f1e9" stroke-width="1.3" opacity=".5"/>
  <path d="M116 552h76" stroke="#b3d0c3" stroke-width="5" stroke-linecap="round"/>
  <path d="M9 155v65" stroke="#dfdbd2" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- physical claim slip layered in foreground -->
<g transform="translate(49 390) rotate(7 164 148)" filter="url(#paperShadow)">
 <path d="M0 5Q13 1 25 6Q40 0 55 5Q73 1 88 5Q105 0 120 5Q135 1 150 5Q163 0 180 5Q194 1 210 5Q227 0 240 5Q260 1 275 5Q297 0 324 5V306Q310 301 294 306Q273 301 258 306Q238 301 219 306Q199 301 181 306Q164 301 147 306Q126 302 109 306Q89 301 71 306Q54 301 36 306Q14 301 0 306Z" fill="#f8f3e9"/>
 <path d="M24 56H301M24 224H301" stroke="#d7d2c8"/>
 <text x="25" y="35" font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#1b322d" letter-spacing="3">CASE NOTE  /  001</text>
 <text x="25" y="92" font-family="Georgia,serif" font-size="32" font-style="italic" fill="#1b322d">You have options.</text>
 <g font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#1b322d">
  <text x="26" y="140">01</text><text x="76" y="140">REPAIR</text>
  <text x="26" y="174">02</text><text x="76" y="174">REPLACE</text>
  <text x="26" y="208">03</text><text x="76" y="208">REFUND?</text>
 </g>
 <g stroke="#e16d49" stroke-width="2.5"><path d="m265 128 9 8 15-17m-24 43 9 8 15-17" fill="none"/><circle cx="277" cy="200" r="10" fill="none"/></g>
 <text x="24" y="253" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6f746d" letter-spacing="1.3">FACTS FIRST. THEN ACTION.</text>
 <path d="M24 266h250" stroke="#d7d2c8" stroke-dasharray="2 6"/>
 <text x="24" y="290" font-family="Arial,sans-serif" font-size="11" fill="#616862" letter-spacing="1">LEGAL SOURCES  /  NO GUESSWORK</text>
</g>
<g transform="translate(568 519) rotate(-14)">
 <rect width="145" height="56" rx="3" fill="#142a24" stroke="#fff2df" stroke-width="1.7"/>
 <text x="72" y="36" fill="#f9eee0" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="18" letter-spacing="1.8">KNOW MORE ↗</text>
</g>
<text x="55" y="771" font-family="Arial,sans-serif" font-size="12" fill="#b8ccc0" letter-spacing="2">REPAIR / REPLACEMENT / CONDITIONAL REFUND</text>
</svg>
