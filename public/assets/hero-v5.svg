  <rect x="9" y="0" width="277" height="582" rx="45" fill="url(#steel)" stroke="#a1aba2" stroke-opacity=".65" stroke-width="2"/>
  <rect x="21" y="11" width="253" height="559" rx="35" fill="#081410"/>
  <rect x="27" y="17" width="241" height="548" rx="32" fill="url(#glass)"/>
  <path d="M44 51C127 63 135 135 275 165V20H27v159C52 160 101 128 136 141" fill="#e5e5d1" opacity=".11"/>
