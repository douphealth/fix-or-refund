<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" role="img" aria-label="Editorial illustration of a damaged phone and a consumer claim document">
<defs>
  <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#182824"/><stop offset="1" stop-color="#0c1917"/></linearGradient>
  <linearGradient id="glass" x1="0" x2=".93" y1="0" y2="1"><stop stop-color="#a9c1bb"/><stop offset=".42" stop-color="#516d68"/><stop offset="1" stop-color="#1a302c"/></linearGradient>
  <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#323e3c"/><stop offset=".52" stop-color="#0d1d1b"/><stop offset="1" stop-color="#58716a"/></linearGradient>
  <linearGradient id="sun" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#f58b66"/><stop offset="1" stop-color="#db5138"/></linearGradient>
  <filter id="shadow" x="-45%" y="-40%" width="200%" height="190%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="paperShadow" x="-30%" y="-30%" width="180%" height="190%"><feDropShadow dx="-10" dy="19" stdDeviation="17" flood-color="#000" flood-opacity=".25"/></filter>
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#fff" stroke-opacity=".058" stroke-width="1"/></pattern>
  <pattern id="specks" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="1" fill="#fff" fill-opacity=".13"/></pattern>
</defs>
<rect width="780" height="800" fill="url(#floor)"/>
<rect width="780" height="800" fill="url(#grid)"/>
<rect width="780" height="800" fill="url(#specks)"/>
<circle cx="423" cy="358" r="288" fill="#ed7150"/>
<circle cx="423" cy="358" r="268" fill="none" stroke="#efb09d" stroke-width="2" stroke-opacity=".6"/>
<path d="M0 716h780" stroke="#c4ccbf" opacity=".4"/>
<text x="54" y="62" font-family="Arial,sans-serif" font-size="13" fill="#d5ded9" letter-spacing="3.5">THE CONSUMER DESK / 2026</text>
<text x="732" y="62" font-family="Arial,sans-serif" font-size="15" fill="#fff" text-anchor="end">FIG. 01</text>
<path d="M57 106h66M90 73v66" stroke="#e5f1e9" stroke-opacity=".5" stroke-width="1.5"/>
<path d="M682 672h66M715 639v66" stroke="#e5f1e9" stroke-opacity=".5" stroke-width="1.5"/>
<ellipse cx="421" cy="679" rx="218" ry="45" fill="#090f0d" opacity=".45" filter="url(#shadow)"/>
<!-- angled phone silhouette -->
